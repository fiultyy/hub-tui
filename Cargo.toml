[package]
name = "hub-tui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hub-tui"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.28", features = ["crossterm"] }
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
unicode-width = "0.1"

[profile.release]
opt-level = 2
